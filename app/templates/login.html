<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — база знаний MAXMA</title>
  <script>
    (function(){
      try{
        var t = localStorage.getItem('kb-theme');
        if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <style>
    :root{
      --accent:#4f46e5; --accent-hover:#4338ca; --accent-weak:#eef2ff;
      --bg:#f7f8fa; --surface:#fff; --surface-2:#f2f4f7;
      --text:#111827; --muted:#5b6472; --faint:#8b95a5;
      --line:#e5e8ec; --line-2:#d6dae1; --err:#d13438; --err-bg:#fdeceb;
      --shadow:0 1px 3px rgba(16,24,40,.08), 0 12px 40px rgba(16,24,40,.09);
      --r:12px; --r-sm:9px;
    }
    [data-theme="dark"]{
      --accent:#6d76f7; --accent-hover:#818cf8; --accent-weak:rgba(109,118,247,.16);
      --bg:#0c0e14; --surface:#13161f; --surface-2:#1a1e2a;
      --text:#e8ebf2; --muted:#9aa3b5; --faint:#6d7688;
      --line:#242938; --line-2:#323848; --err:#ff7a7a; --err-bg:rgba(255,122,122,.12);
      --shadow:0 1px 3px rgba(0,0,0,.4), 0 16px 48px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
      font-size:14px; color:var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, var(--accent-weak) 0%, transparent 60%),
        var(--bg);
    }
    .box{width:100%; max-width:380px}
    .logo{
      width:46px; height:46px; border-radius:13px; margin:0 auto 16px;
      background:linear-gradient(135deg,var(--accent),#8b5cf6);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:21px; font-weight:700;
    }
    h1{font-size:19px; font-weight:650; text-align:center; margin:0 0 5px; letter-spacing:-.01em}
    .sub{text-align:center; color:var(--muted); font-size:13.2px; margin:0 0 22px}
    .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:var(--shadow)}
    label{display:block; font-size:13px; font-weight:560; margin-bottom:7px}
    input{
      width:100%; font:inherit; font-size:14px; padding:11px 13px; color:var(--text);
      background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm); outline:none; transition:.13s;
    }
    input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak)}
    button{
      width:100%; margin-top:16px; font:inherit; font-size:14px; font-weight:580; cursor:pointer;
      background:var(--accent); color:#fff; border:none; padding:11px; border-radius:var(--r-sm); transition:.13s;
    }
    button:hover{background:var(--accent-hover)}
    .err{background:var(--err-bg); color:var(--err); font-size:13px; padding:10px 13px; border-radius:var(--r-sm); margin-bottom:16px}
    .foot{text-align:center; color:var(--faint); font-size:12.3px; margin-top:18px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">M</div>
    <h1>База знаний MAXMA</h1>
    <p class="sub">Панель управления AI-агентом</p>
    <div class="card">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="em">Email</label>
        <input id="em" type="email" name="email" placeholder="you@maxma.com" autocomplete="username" autofocus required style="margin-bottom:14px">
        <label for="pw">Пароль</label>
        <input id="pw" type="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
        <button type="submit">Войти</button>
      </form>
    </div>
    <p class="foot">Доступ только для сотрудников</p>
  </div>
</body>
</html>
