{% extends "base.html" %}
{% block title %}Смена пароля — база знаний{% endblock %}
{% block page_title %}Сменить пароль{% endblock %}

{% block content %}

<div class="card" style="max-width:420px">
  {% if success %}
  <div class="alert ok" style="margin:0 0 16px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>
    <div class="txt">Пароль обновлён.</div>
  </div>
  {% endif %}
  {% if error %}
  <div class="alert err" style="margin:0 0 16px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="txt">{{ error }}</div>
  </div>
  {% endif %}

  <p class="desc" style="margin-top:0">Аккаунт: <b>{{ email }}</b></p>

  <form method="post" action="/admin/change_password">
    <div class="field">
      <label for="cur">Текущий пароль</label>
      <input id="cur" type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new1">Новый пароль</label>
      <input id="new1" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
      <span class="hint">Не короче 8 символов.</span>
    </div>
    <div class="field">
      <label for="new2">Повторите новый пароль</label>
      <input id="new2" type="password" name="new_password2" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit">Сохранить пароль</button>
  </form>
</div>

{% endblock %}
