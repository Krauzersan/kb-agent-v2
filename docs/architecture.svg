<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-label="Как вопрос становится ответом: каналы отправляют вопрос и документы в FastAPI-сервис; документы режутся на куски и индексируются в Qdrant (векторы) и SQLite FTS5 (полнотекстовый поиск); вопрос ищется в обоих сразу, результаты объединяются RRF-фьюжном, уточняются кросс-энкодер реранкером, передаются в LLM с автоматическим фоллбэком между провайдерами, и ответ возвращается в исходный канал.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
    .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.6; }
    .storage { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .txt { fill: #1f2328; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
    .txt-sm { fill: #1f2328; font: 400 11.5px -apple-system, "Segoe UI", sans-serif; }
    .muted { fill: #656d76; font: 400 11px -apple-system, "Segoe UI", sans-serif; }
    .accent-txt { fill: #3730a3; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #656d76; font: 400 10.5px -apple-system, "Segoe UI", sans-serif; }
    .arrow { stroke: #8b949e; stroke-width: 1.4; fill: none; }
    .arrowhead { fill: #8b949e; }
    .grp { fill: none; stroke: #8b949e; stroke-width: 1.2; }
    .grp-label { fill: #656d76; font: 600 10.5px -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #1c1f3a; stroke: #818cf8; }
      .storage { fill: #161b22; stroke: #6e7681; }
      .txt { fill: #e6edf3; }
      .txt-sm { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .accent-txt { fill: #c7d2fe; }
      .label { fill: #8b949e; }
      .arrow { stroke: #6e7681; }
      .arrowhead { fill: #6e7681; }
      .grp { stroke: #6e7681; }
      .grp-label { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="560"/>

  <!-- Channels -->
  <rect class="grp" x="14" y="30" width="164" height="252" rx="10"/>
  <text class="grp-label" x="24" y="22">Каналы</text>
  <rect class="box" x="26" y="42" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="65" text-anchor="middle">Админ-панель</text>
  <rect class="box" x="26" y="88" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="111" text-anchor="middle">Пачка</text>
  <rect class="box" x="26" y="134" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="157" text-anchor="middle">Omnidesk</text>
  <rect class="box" x="26" y="180" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="203" text-anchor="middle">Telegram</text>
  <rect class="box" x="26" y="226" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="249" text-anchor="middle">WhatsApp</text>

  <!-- vertical spine from channel group to two exits -->
  <line class="arrow" x1="178" y1="156" x2="212" y2="156" stroke-dasharray="0"/>
  <line class="arrow" x1="212" y1="156" x2="212" y2="64" marker-end="url(#arrow)"/>
  <line class="arrow" x1="212" y1="156" x2="212" y2="364" marker-end="url(#arrow)"/>
  <text class="label" x="216" y="100">документы</text>
  <text class="label" x="216" y="270">вопрос</text>

  <!-- Ingest row -->
  <text class="grp-label" x="230" y="22">Загрузка в базу</text>
  <rect class="box" x="230" y="46" width="150" height="44" rx="7"/>
  <text class="txt-sm" x="305" y="64" text-anchor="middle">Файл / URL / OCR</text>
  <text class="muted" x="305" y="79" text-anchor="middle">PDF·Word·Excel·фото</text>

  <line class="arrow" x1="380" y1="68" x2="418" y2="68" marker-end="url(#arrow)"/>

  <rect class="box" x="418" y="46" width="92" height="44" rx="7"/>
  <text class="txt-sm" x="464" y="72" text-anchor="middle">Chunk</text>

  <line class="arrow" x1="510" y1="68" x2="548" y2="68" marker-end="url(#arrow)"/>

  <rect class="box" x="548" y="46" width="150" height="44" rx="7"/>
  <text class="txt-sm" x="623" y="64" text-anchor="middle">Embed</text>
  <text class="muted" x="623" y="79" text-anchor="middle">multilingual-e5</text>

  <!-- Storage row -->
  <text class="grp-label" x="392" y="166">Хранилище</text>
  <rect class="storage" x="392" y="172" width="240" height="60" rx="7"/>
  <text class="txt-sm" x="512" y="196" text-anchor="middle">SQLite</text>
  <text class="muted" x="512" y="212" text-anchor="middle">FTS5 · метаданные · ключи (зашифр.)</text>

  <rect class="storage" x="662" y="172" width="150" height="60" rx="7"/>
  <text class="txt-sm" x="737" y="196" text-anchor="middle">Qdrant</text>
  <text class="muted" x="737" y="212" text-anchor="middle">векторный индекс</text>

  <line class="arrow" x1="464" y1="90" x2="500" y2="172" marker-end="url(#arrow)"/>
  <text class="label" x="326" y="112">текст куска → FTS5</text>
  <line class="arrow" x1="623" y1="90" x2="720" y2="172" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="112">векторы</text>

  <!-- Query row -->
  <text class="grp-label" x="230" y="336">Ответ на вопрос</text>
  <rect class="box" x="230" y="342" width="120" height="44" rx="7"/>
  <text class="txt-sm" x="290" y="368" text-anchor="middle">Вопрос</text>

  <line class="arrow" x1="512" y1="232" x2="452" y2="342" marker-end="url(#arrow)"/>
  <text class="label" x="392" y="295">BM25 top-N</text>
  <line class="arrow" x1="737" y1="232" x2="498" y2="342" marker-end="url(#arrow)"/>
  <text class="label" x="600" y="270">вектор top-N</text>

  <line class="arrow" x1="350" y1="364" x2="418" y2="364" marker-end="url(#arrow)"/>

  <rect class="accent" x="418" y="342" width="110" height="44" rx="7"/>
  <text class="accent-txt" x="473" y="368" text-anchor="middle">RRF-фьюжн</text>

  <line class="arrow" x1="528" y1="364" x2="566" y2="364" marker-end="url(#arrow)"/>

  <rect class="accent" x="566" y="342" width="160" height="44" rx="7"/>
  <text class="accent-txt" x="646" y="362" text-anchor="middle">Реранкер</text>
  <text class="muted" x="646" y="378" text-anchor="middle">cross-encoder, опц.</text>

  <line class="arrow" x1="726" y1="364" x2="762" y2="364" marker-end="url(#arrow)"/>

  <rect class="box" x="762" y="330" width="230" height="68" rx="7"/>
  <text class="txt-sm" x="877" y="354" text-anchor="middle">Claude → OpenAI →</text>
  <text class="txt-sm" x="877" y="370" text-anchor="middle">DeepSeek → GigaChat</text>
  <text class="muted" x="877" y="386" text-anchor="middle">автофоллбэк, если провайдер недоступен</text>

  <line class="arrow" x1="992" y1="364" x2="1024" y2="364" marker-end="url(#arrow)"/>

  <rect class="box" x="1024" y="342" width="118" height="44" rx="7"/>
  <text class="txt-sm" x="1083" y="368" text-anchor="middle">Ответ</text>

  <!-- return path -->
  <path class="arrow" d="M 1083,386 L 1083,470 L 96,470 L 96,282" marker-end="url(#arrow)"/>
  <text class="label" x="560" y="484" text-anchor="middle">ответ (+ скриншоты из базы) — обратно в тот же канал</text>
</svg>
