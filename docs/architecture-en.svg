<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" role="img" aria-label="How a question becomes an answer: channels send a question or a document into the FastAPI service; documents get chunked and embedded into Qdrant (vectors) and SQLite FTS5 (full-text); a question is first classified by a router into FAST, AGGREGATION or DEEP; FAST searches both stores at once and fuses results with RRF, refined by a cross-encoder reranker; AGGREGATION scans the catalog or the full text of the base; DEEP decomposes the question into sub-questions, searches facts for each, builds a plan and generates the answer section by section; all three paths go to an LLM with automatic provider fallback, and the answer returns to whichever channel asked.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
    .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.6; }
    .storage { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .txt { fill: #1f2328; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
    .txt-sm { fill: #1f2328; font: 400 11.5px -apple-system, "Segoe UI", sans-serif; }
    .muted { fill: #656d76; font: 400 11px -apple-system, "Segoe UI", sans-serif; }
    .accent-txt { fill: #3730a3; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #656d76; font: 400 10.5px -apple-system, "Segoe UI", sans-serif; }
    .lane-label { fill: #4f46e5; font: 700 10.5px -apple-system, "Segoe UI", sans-serif; }
    .arrow { stroke: #8b949e; stroke-width: 1.4; fill: none; }
    .arrowhead { fill: #8b949e; }
    .grp { fill: none; stroke: #8b949e; stroke-width: 1.2; }
    .grp-label { fill: #656d76; font: 600 10.5px -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #1c1f3a; stroke: #818cf8; }
      .storage { fill: #161b22; stroke: #6e7681; }
      .txt { fill: #e6edf3; }
      .txt-sm { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .accent-txt { fill: #c7d2fe; }
      .label { fill: #8b949e; }
      .lane-label { fill: #a5b4fc; }
      .arrow { stroke: #6e7681; }
      .arrowhead { fill: #6e7681; }
      .grp { stroke: #6e7681; }
      .grp-label { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="700"/>

  <!-- Channels -->
  <rect class="grp" x="14" y="30" width="164" height="252" rx="10"/>
  <text class="grp-label" x="24" y="22">Channels</text>
  <rect class="box" x="26" y="42" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="65" text-anchor="middle">Admin panel</text>
  <rect class="box" x="26" y="88" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="111" text-anchor="middle">Pachca</text>
  <rect class="box" x="26" y="134" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="157" text-anchor="middle">Omnidesk</text>
  <rect class="box" x="26" y="180" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="203" text-anchor="middle">Telegram</text>
  <rect class="box" x="26" y="226" width="140" height="36" rx="7"/>
  <text class="txt-sm" x="96" y="249" text-anchor="middle">WhatsApp</text>

  <!-- vertical spine from channel group to two exits -->
  <line class="arrow" x1="178" y1="156" x2="212" y2="156" stroke-dasharray="0"/>
  <line class="arrow" x1="212" y1="156" x2="212" y2="64" marker-end="url(#arrow)"/>
  <line class="arrow" x1="212" y1="156" x2="212" y2="364" marker-end="url(#arrow)"/>
  <text class="label" x="216" y="100">documents</text>
  <text class="label" x="216" y="270">question</text>

  <!-- Ingest row -->
  <text class="grp-label" x="230" y="22">Ingest</text>
  <rect class="box" x="230" y="46" width="150" height="44" rx="7"/>
  <text class="txt-sm" x="305" y="64" text-anchor="middle">File / URL / OCR</text>
  <text class="muted" x="305" y="79" text-anchor="middle">PDF·Word·Excel·photo</text>

  <line class="arrow" x1="380" y1="68" x2="418" y2="68" marker-end="url(#arrow)"/>

  <rect class="box" x="418" y="46" width="92" height="44" rx="7"/>
  <text class="txt-sm" x="464" y="72" text-anchor="middle">Chunk</text>

  <line class="arrow" x1="510" y1="68" x2="548" y2="68" marker-end="url(#arrow)"/>

  <rect class="box" x="548" y="46" width="150" height="44" rx="7"/>
  <text class="txt-sm" x="623" y="64" text-anchor="middle">Embed</text>
  <text class="muted" x="623" y="79" text-anchor="middle">multilingual-e5</text>

  <!-- Storage row -->
  <text class="grp-label" x="392" y="166">Storage</text>
  <rect class="storage" x="392" y="172" width="240" height="60" rx="7"/>
  <text class="txt-sm" x="512" y="196" text-anchor="middle">SQLite</text>
  <text class="muted" x="512" y="212" text-anchor="middle">FTS5 · metadata · keys (encrypted)</text>

  <rect class="storage" x="662" y="172" width="150" height="60" rx="7"/>
  <text class="txt-sm" x="737" y="196" text-anchor="middle">Qdrant</text>
  <text class="muted" x="737" y="212" text-anchor="middle">vector index</text>

  <line class="arrow" x1="464" y1="90" x2="500" y2="172" marker-end="url(#arrow)"/>
  <text class="label" x="326" y="112">chunk text → FTS5</text>
  <line class="arrow" x1="623" y1="90" x2="720" y2="172" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="112">vectors</text>

  <!-- Query / Router section -->
  <text class="grp-label" x="230" y="306">Answering a question</text>
  <rect class="box" x="230" y="342" width="120" height="44" rx="7"/>
  <text class="txt-sm" x="290" y="368" text-anchor="middle">Question</text>

  <line class="arrow" x1="350" y1="364" x2="380" y2="364" marker-end="url(#arrow)"/>

  <rect class="accent" x="380" y="342" width="110" height="44" rx="7"/>
  <text class="accent-txt" x="435" y="362" text-anchor="middle">Router</text>
  <text class="muted" x="435" y="378" text-anchor="middle">by meaning</text>

  <!-- Router fan-out: FAST (right), AGGREGATION / DEEP (down) -->
  <line class="arrow" x1="490" y1="364" x2="562" y2="364" marker-end="url(#arrow)"/>
  <text class="lane-label" x="497" y="356">FAST</text>

  <line class="arrow" x1="435" y1="386" x2="435" y2="465" stroke-dasharray="0"/>
  <line class="arrow" x1="435" y1="465" x2="562" y2="465" marker-end="url(#arrow)"/>
  <text class="lane-label" x="440" y="428">AGGREGATION</text>

  <line class="arrow" x1="435" y1="465" x2="435" y2="555" stroke-dasharray="0"/>
  <line class="arrow" x1="435" y1="555" x2="562" y2="555" marker-end="url(#arrow)"/>
  <text class="lane-label" x="440" y="516">DEEP</text>

  <!-- FAST lane -->
  <line class="arrow" x1="562" y1="232" x2="602" y2="342" marker-end="url(#arrow)"/>
  <text class="label" x="502" y="295">BM25 top-N</text>
  <line class="arrow" x1="737" y1="232" x2="648" y2="342" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="270">vector top-N</text>

  <rect class="accent" x="562" y="342" width="110" height="44" rx="7"/>
  <text class="accent-txt" x="617" y="368" text-anchor="middle">RRF fusion</text>

  <line class="arrow" x1="672" y1="364" x2="710" y2="364" marker-end="url(#arrow)"/>

  <rect class="accent" x="710" y="342" width="160" height="44" rx="7"/>
  <text class="accent-txt" x="790" y="362" text-anchor="middle">Reranker</text>
  <text class="muted" x="790" y="378" text-anchor="middle">cross-encoder, optional</text>

  <line class="arrow" x1="870" y1="364" x2="906" y2="364" marker-end="url(#arrow)"/>

  <rect class="box" x="906" y="330" width="230" height="68" rx="7"/>
  <text class="txt-sm" x="1021" y="354" text-anchor="middle">Claude → OpenAI →</text>
  <text class="txt-sm" x="1021" y="370" text-anchor="middle">DeepSeek → GigaChat</text>
  <text class="muted" x="1021" y="386" text-anchor="middle">auto-fallback if a provider is unavailable</text>

  <line class="arrow" x1="1136" y1="364" x2="1168" y2="364" marker-end="url(#arrow)"/>

  <!-- AGGREGATION lane -->
  <rect class="box" x="562" y="440" width="280" height="50" rx="7"/>
  <text class="txt-sm" x="702" y="461" text-anchor="middle">Catalog / Full-scan</text>
  <text class="muted" x="702" y="477" text-anchor="middle">every file's summary — or a full-text sweep</text>

  <path class="arrow" d="M 842,465 L 1194,465 L 1194,398" marker-end="url(#arrow)"/>

  <!-- DEEP lane -->
  <rect class="box" x="562" y="530" width="150" height="50" rx="7"/>
  <text class="txt-sm" x="637" y="551" text-anchor="middle">Decompose</text>
  <text class="muted" x="637" y="567" text-anchor="middle">question → sub-questions</text>

  <line class="arrow" x1="712" y1="555" x2="742" y2="555" marker-end="url(#arrow)"/>

  <rect class="box" x="742" y="530" width="180" height="50" rx="7"/>
  <text class="txt-sm" x="832" y="551" text-anchor="middle">Search facts</text>
  <text class="muted" x="832" y="567" text-anchor="middle">per sub-question</text>

  <line class="arrow" x1="922" y1="555" x2="952" y2="555" marker-end="url(#arrow)"/>

  <rect class="box" x="952" y="530" width="220" height="50" rx="7"/>
  <text class="txt-sm" x="1062" y="551" text-anchor="middle">Plan → sections → merge</text>
  <text class="muted" x="1062" y="567" text-anchor="middle">each section is its own LLM call</text>

  <path class="arrow" d="M 1172,555 L 1236,555 L 1236,398" marker-end="url(#arrow)"/>

  <!-- shared answer -->
  <rect class="box" x="1168" y="342" width="118" height="44" rx="7"/>
  <text class="txt-sm" x="1227" y="368" text-anchor="middle">Answer</text>

  <!-- return path -->
  <path class="arrow" d="M 1227,386 L 1227,624 L 96,624 L 96,282" marker-end="url(#arrow)"/>
  <text class="label" x="660" y="638" text-anchor="middle">answer (+ screenshots from the base) — back to the same channel</text>
</svg>
