# One-command deploy with automatic HTTPS: "docker compose up -d".
#
# Set DOMAIN in .env first (a real domain for a real cert, or ":80" for plain HTTP
# on a local/test box). Everything else the app needs is already in .env too — see
# .env.example. The app container isn't published to the host on purpose: Caddy is
# the only way in, terminates TLS, and forwards over the compose network.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - kb-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8746/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kb-agent-data:
  caddy-data:
  caddy-config:
